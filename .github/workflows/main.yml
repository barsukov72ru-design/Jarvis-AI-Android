name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Buildozer dependencies
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer plyer requests urllib3 certifi

    # ПОЛНОЕ СОЗДАНИЕ ВСЕЙ СТРУКТУРЫ ПАПОК ДЛЯ БУЛЬДОЗЕРА
    - name: Manually Create Absolute Android SDK Structure
      run: |
        # 1. Создаем папки для build-tools и tools/bin, которые он просит
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        
        # 2. Копируем рабочий aidl в обе папки
        cp /usr/local/lib/android/sdk/build-tools/34.0.0/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
        cp /usr/local/lib/android/sdk/build-tools/34.0.0/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0/
        
        # 3. Делаем прямую ссылку на рабочий sdkmanager, чтобы обмануть проверку
        ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 4. Даем полные права на запуск всем утилитам
        chmod +x /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
        chmod +x /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0/aidl
        
        echo "✅ Вся структура SDK создана вручную! sdkmanager и aidl на месте."

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
