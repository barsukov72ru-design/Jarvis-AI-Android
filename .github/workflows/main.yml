name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # БЕЗОПАСНЫЙ ФИКС: Создаем проект рядом и правильно распределяем файлы
    - name: Create Flutter Project Structure
      run: |
        # 1. Создаем чистый проект во временной папке снаружи репозитория
        flutter create --org com.stark --project-name jarvis_ai --platforms=android /tmp/clean_project
        
        # 2. Переносим сгенерированную структуру Android к нам в репозиторий
        cp -r /tmp/clean_project/android ./
        
        # 3. Создаем папку lib и ПРИНУДИТЕЛЬНО переносим main.dart внутрь неё
        mkdir -p lib
        if [ -f "main.dart" ]; then
          mv main.dart lib/main.dart
          echo "✅ Файл main.dart успешно перенесен в папку lib/"
        fi
        
        # 4. Настраиваем принудительный minSdkVersion
        echo "flutter.minSdkVersion=21" >> android/local.properties
        
        # 5. Проверяем зависимости
        flutter pub get
        echo "✅ Структура проекта полностью готова к сборке!"

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Flutter-APK
        path: build/app/outputs/flutter-apk/app-release.apk
