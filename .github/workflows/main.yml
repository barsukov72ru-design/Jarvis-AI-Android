name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ИСПОЛЬЗУЕМ ОФИЦИАЛЬНЫЙ ГОТОВЫЙ КОНТЕЙНЕР ДЛЯ СБОРКИ KIVY
    - name: Build APK with Buildozer Action
      uses: Artemis-chan/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_path: .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
