name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Buildozer dependencies
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer plyer requests urllib3 certifi

    # ПРИНУДИТЕЛЬНЫЙ УДАР: Заставляем Buildozer инициализировать свой SDK и качаем build-tools напрямую
    - name: Pre-install Android Build-Tools via Buildozer SDK
      run: |
        # 1. Заставляем Buildozer создать структуру папок Android SDK
        buildozer android p4a -- get_api_level 2>/dev/null || true
        
        # 2. Находим, куда встал локальный sdkmanager, и принудительно качаем build-tools и aidl
        LOCAL_SDK="/home/runner/.buildozer/android/platform/android-sdk"
        if [ -d "$LOCAL_SDK" ]; then
          echo "y" | $LOCAL_SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$LOCAL_SDK "build-tools;34.0.0" "platforms;android-34"
          echo "✅ Дополнительные компоненты SDK успешно установлены в локальную папку!"
        else
          echo "⚠️ Локальная папка SDK еще не создана, полагаемся на переменные окружения."
        fi

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
