name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # НАДЕЖНЫЙ ФИКС: Очищаем остатки старых файлов и разворачиваем чистую структуру
    - name: Create Flutter Project Structure
      run: |
        # Временно прячем наши файлы во внешнюю память, чтобы они не мешали flutter create
        mkdir /tmp/jarvis_backup
        mv main.dart pubspec.yaml /tmp/jarvis_backup/
        
        # Полностью вычищаем текущую папку репозитория
        rm -rf * .github
        
        # Создаем абсолютно новый чистый нативный проект Android/Flutter
        flutter create --org com.stark --project-name jarvis_ai . -v
        
        # Возвращаем наши файлы обратно на свои места в чистый проект
        rm lib/main.dart pubspec.yaml
        mv /tmp/jarvis_backup/main.dart lib/main.dart
        mv /tmp/jarvis_backup/pubspec.yaml ./pubspec.yaml
        
        # Теперь папка android гарантированно существует. Повышаем minSdkVersion до 21
        sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
        echo "✅ Структура Android проекта успешно создана, фикс minSdkVersion применен!"

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Flutter-APK
        path: build/app/outputs/flutter-apk/app-release.apk
