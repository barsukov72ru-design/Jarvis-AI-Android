name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java Development Kit (JDK 11)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install pip dependencies
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer plyer requests urllib3 certifi

    # ЖЕЛЕЗОБЕТОННЫЙ ФИКС: Создаем пути, которые так отчаянно ищет Buildozer
    - name: Link Android SDK Tools and Aidl
      run: |
        # 1. Создаем структуру папок, которую требует Buildozer
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0
        
        # 2. Делаем ссылку на sdkmanager из нового cmdline-tools в старый tools/bin
        ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 3. Копируем утилиту aidl туда, где её ждет компилятор
        cp /usr/local/lib/android/sdk/build-tools/34.0.0/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0/ 2>/dev/null || \
        cp /usr/local/lib/android/sdk/build-tools/*/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0/ | head -n 1
        
        echo "✅ Обман путей успешно настроен! sdkmanager и aidl залинкованы."

    - name: Build with Buildozer
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
