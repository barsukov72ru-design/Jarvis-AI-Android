name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Buildozer dependencies
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer plyer requests urllib3 certifi

    # СОЗДАЕМ СТРУКТУРУ ПАПОК ВРУЧНУЮ ПОД BUILDOZER
    - name: Manually Create Android SDK Directory Structure
      run: |
        # Создаем папки build-tools, которые так упорно требует Buildozer
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0
        
        # Находим рабочий aidl на сервере GitHub и принудительно копируем его в обе папки
        cp /usr/local/lib/android/sdk/build-tools/34.0.0/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
        cp /usr/local/lib/android/sdk/build-tools/34.0.0/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0/
        
        # Проверяем, что файлы легли куда нужно и имеют права на запуск
        chmod +x /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
        chmod +x /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0/aidl
        
        echo "✅ Вся структура папок создана силой. aidl скопирован и готов к бою!"

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
