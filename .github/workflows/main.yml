name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # НАДЕЖНЫЙ ФИКС: Используем современную структуру папок Flutter
    - name: Create Flutter Project Structure
      run: |
        # Временно прячем файлы
        mkdir /tmp/jarvis_backup
        mv main.dart pubspec.yaml /tmp/jarvis_backup/
        
        # Полностью вычищаем текущую папку репозитория
        rm -rf * .github
        
        # Создаем проект
        flutter create --org com.stark --project-name jarvis_ai --platforms=android . -v
        
        # Возвращаем файлы
        rm lib/main.dart pubspec.yaml
        mv /tmp/jarvis_backup/main.dart lib/main.dart
        mv /tmp/jarvis_backup/pubspec.yaml ./pubspec.yaml
        
        # ЖЕЛЕЗОБЕТОННЫЙ ФИКС: Вместо sed прописываем minSdkVersion напрямую в local.properties
        echo "flutter.minSdkVersion=21" >> android/local.properties
        echo "✅ Проект сгенерирован, local.properties обновлен!"

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Flutter-APK
        path: build/app/outputs/flutter-apk/app-release.apk
