name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # Создаем структуру и жестко правим файлы конфигурации Android
    - name: Create Flutter Project Structure
      run: |
        flutter create --org com.stark . --empty -v
        rm lib/main.dart
        mv main.dart lib/main.dart
        
        # Фикс minSdkVersion для корректной работы flutter_tts
        sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Flutter-APK
        path: build/app/outputs/flutter-apk/app-release.apk
