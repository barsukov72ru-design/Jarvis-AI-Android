name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # ХИТРЫЙ ФИКС: Принудительно заставляем создать именно Android-платформу
    - name: Create Flutter Project Structure
      run: |
        # Временно прячем наши файлы
        mkdir /tmp/jarvis_backup
        mv main.dart pubspec.yaml /tmp/jarvis_backup/
        
        # Полностью вычищаем текущую папку
        rm -rf * .github
        
        # ЖЕСТКИЙ ФЛАГ: --platforms=android заставит создать папку android на Linux-сервере
        flutter create --org com.stark --project-name jarvis_ai --platforms=android . -v
        
        # Возвращаем наши файлы обратно
        rm lib/main.dart pubspec.yaml
        mv /tmp/jarvis_backup/main.dart lib/main.dart
        mv /tmp/jarvis_backup/pubspec.yaml ./pubspec.yaml
        
        # Теперь файл точно на месте. Фиксим minSdkVersion
        sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
        echo "✅ Папка android создана, фикс minSdkVersion применен успешно!"

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Flutter-APK
        path: build/app/outputs/flutter-apk/app-release.apk
