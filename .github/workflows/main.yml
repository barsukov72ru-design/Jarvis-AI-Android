name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Java Development Kit (JDK 11)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    # НАДЕЖНЫЙ ФИКС: Принудительно ставим Android SDK и build-tools через официальный шаг
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android Build Tools
      run: |
        sdkmanager "build-tools;31.0.0" "platforms;android-31" "platform-tools"

    - name: Install pip dependencies
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer plyer requests urllib3 certifi

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
