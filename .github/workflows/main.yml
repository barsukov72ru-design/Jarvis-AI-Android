name: Build APK with Briefcase

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Briefcase
      run: |
        pip install --upgrade pip
        pip install briefcase

    # Создаем и компилируем Android проект без использования капризного Buildozer
    - name: Package App for Android
      run: |
        briefcase create android --no-input
        briefcase build android --no-input

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: build/jarvisapp/android/gradle/app/build/outputs/apk/debug/*.apk
